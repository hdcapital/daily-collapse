name: ASX Daily Crash Send

on:
  schedule:
    # 19:00 UTC = 5:00am AEST the next morning (6:00am AEDT in summer).
    # Delivers the report saved by daily-scan.yml the previous Sydney evening.
    # Mon-Fri UTC = Tue-Sat mornings Sydney, one delivery per trading session.
    - cron: "0 19 * * 1-5"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Locate today's scan run
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        # Look back 20h (= MAX_REPORT_AGE_HOURS), not "same UTC date": GitHub
        # starts scheduled runs hours late (Oct 2026: scan up to ~9.5h, send up
        # to ~6h), so the send can land after 00:00 UTC while its scan ran the
        # previous UTC day. No successful scan in the window means there is
        # nothing fresh to send — fail loudly rather than deliver a stale report.
        run: |
          since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          run_id=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-scan.yml/runs" \
            -f status=success -f "created=>=${since}" -f per_page=1 --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful scan run since ${since} — refusing to send a stale report."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the saved report
        uses: actions/download-artifact@v4
        with:
          name: report
          path: out/
          run-id: ${{ steps.scan.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Send the report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.main --send-only
