name: ASX Daily Crash Scan

on:
  schedule:
    # 10:00 UTC = 8:00pm AEST / 9:00pm AEDT — the same Sydney evening as the
    # close, while Yahoo still serves the session's bar from its live feed.
    # After Sydney midnight the completed bar vanishes from the daily history
    # until Yahoo's EOD consolidation (observed still missing at 6:43am), so
    # the scan CANNOT run at delivery time: this job only renders and saves
    # the report, and daily-send.yml emails it at ~5am Sydney.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Limit universe size (for fast testing, 0 = full)"
        default: "0"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cheap offline gate — don't save a report built from broken code.
      - name: Run tests
        run: pytest -q

      - name: Run scan (render only — daily-send.yml delivers it)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional data-lake (S3) credentials — leave unset to skip the lake scan
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          DATALAKE_S3_BUCKET: ${{ secrets.DATALAKE_S3_BUCKET }}
          DATALAKE_S3_PREFIX: ${{ secrets.DATALAKE_S3_PREFIX }}
        run: |
          ARGS="--dry-run"
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m src.main $ARGS

      - name: Save report for the morning send
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: out/
          if-no-files-found: error
