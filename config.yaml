# ===== ASX Crash Scanner configuration =====

# A stock is flagged when today's close is down MORE than this % vs the prior close.
threshold_pct: 15.0

# --- Sector exclusion feature ---
# Flip `enabled: true` and list GICS industry groups to hide from the report.
# Names must match the ASX directory's "GICs industry group" column, e.g.:
#   Materials, Energy, Pharmaceuticals Biotechnology & Life Sciences,
#   Software & Services, Banks, Real Estate, Capital Goods,
#   Health Care Equipment & Services, Food Beverage & Tobacco,
#   Diversified Financials, Media & Entertainment, Retailing, Utilities
exclude_sectors:
  enabled: false
  sectors:
    - Materials          # example: mute the flood of tiny explorers
    - Energy

# Ignore micro-caps below this market cap (AUD). 0 = no filter.
min_market_cap_aud: 0

# Only report companies whose trailing-twelve-month revenue is at least this
# (AUD). 0 = no filter. Most ASX stocks that fall hard in a day are pre-revenue
# explorers, so switching this on shrinks the report a long way.
min_revenue_aud: 20000000
# Yahoo has no revenue figure for some companies. When the screen is on they are
# dropped by default — you cannot show a stock is above the bar without a number.
# Set true to keep them instead.
# This only applies when Yahoo answered. If the fundamentals request itself
# failed (rate limit, outage), the stock is always kept — better to report too
# many than to silently drop a confirmed faller.
include_unknown_revenue: false

# Safety valve: cap how many stocks get the full AI + fundamentals treatment
# (on a bloodbath day the tail is truncated, worst falls first).
max_stocks_in_email: 40

# AI analysis of why each stock sold off (needs OPENAI_API_KEY secret).
# Uses the OpenAI Responses API with the built-in server-side web_search tool.
ai_analysis:
  enabled: true
  model: gpt-5.6-terra
  max_web_searches_per_stock: 3   # -> max_tool_calls
  max_output_tokens: 2000
  # search_context_size: medium   # low | medium | high
  # reasoning_effort: medium      # reasoning models only; omit to use the default

# Data-lake scan: pulls text snippets mentioning the ticker from S3 (optional)
# and/or a local folder, and feeds them to the AI as extra context.
datalake:
  enabled: true
  local_dir: datalake_sample   # set to "" to disable local folder scan
  max_files_per_ticker: 5
  max_chars_per_file: 4000
  # Only use S3 notes modified in the last N days. 0 = no age limit.
  # Applies to S3 only — local files are re-checked-out every run, so their
  # timestamps reflect the checkout, not when the note was written.
  max_age_days: 7
  # The lake written by hdcapital/market-ingestion keeps a per-day index
  # (manifests/<market>/<YYYY-MM-DD>.jsonl) with the ticker for every document.
  # Reading it costs a handful of requests no matter how big the lake grows,
  # and it matches on the ticker field — document filenames are MD5 hashes, so
  # filename matching finds nothing there. markets: [] disables this and falls
  # back to walking the bucket listing (filename matching).
  manifests:
    prefix: market-data/
    markets: [asx]
